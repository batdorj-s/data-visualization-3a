# MBA dashboard-ийн загвар (лекц 10–11 + ui-ux-pro-max "Data-Dense Dashboard" систем).
# Цайвар суурь, тод текст (WCAG AA 4.5:1+), кирилл үсэгтэй Fira Sans фонт.
# Streamlit нь ажиллуулж буй хавтасны .streamlit/-ийг уншдаг тул repo-ийн үндэс ба mba_analysis/ хоёуланд ижил хуулбар байна.

[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1E40AF"
borderColor = "#DBE3EE"
showWidgetBorder = true
baseRadius = "medium"
baseFontSize = 16
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 600, 600, 600, 600, 600]
headingFontSizes = ["2.25rem", "1.6rem", "1.3rem", "1.1rem", "1rem", "0.9rem"]
chartCategoricalColors = ["#0072B2", "#D55E00", "#009E73", "#E69F00", "#CC79A7", "#56B4E9"]

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2F7"

[client]
toolbarMode = "minimal"
