# MBA Analytics — дизайны систем (бүх токен dashboard/ui.py-ийн TOKENS-тэй ижил утгатай).
# Брэнд: гүн цэнхэр (navy) = итгэл, шинжилгээ; сагсны талбайн улбар шар = зөвхөн брэнд тэмдэг, идэвхтэй навигацид.
# Графикийн өнгө (Okabe–Ito: цэнхэр = дотоод, улаан-улбар = гадаад) UI-ийн өнгөнөөс тусдаа — утга нь хольж болохгүй.
# Цайвар саарал суурь + цагаан карт; бүх текст WCAG AA (4.5:1+). Кирилл үсэгтэй Inter фонт, тоо нь тэгш өргөнтэй.
# Streamlit нь ажиллуулж буй хавтасны .streamlit/-ийг уншдаг тул repo-ийн үндэс ба mba_analysis/ хоёуланд ижил хуулбар байна.

[theme]
base = "light"
primaryColor = "#1B3A6B"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#EDF1F6"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#DCE3EC"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
baseFontSize = 15
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["1.9rem", "1.35rem", "1.1rem", "1rem", "0.95rem", "0.875rem"]
chartCategoricalColors = ["#0072B2", "#D55E00", "#009E73", "#E69F00", "#CC79A7", "#56B4E9"]
dataframeHeaderBackgroundColor = "#F1F4F8"

[theme.sidebar]
backgroundColor = "#0F2240"
secondaryBackgroundColor = "#17305A"
textColor = "#E6ECF5"
borderColor = "#2A4675"
primaryColor = "#F08A3C"

[client]
toolbarMode = "minimal"
