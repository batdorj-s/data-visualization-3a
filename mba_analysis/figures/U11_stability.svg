   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 236.838662)">Дата: MBA лигийн албан ёсны статистик (mongolia.basketball), 2026-11-12-нд татсан · 2025–26 ба 2026–27 улиралд</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 245.585381)">хоёуланд нь тоглосон · 40 тоглогч. Улирал бүрт 50-аас олон шидэлт (3 онооны оновчид 30-аас олон 3 онооны</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 254.292569)">шидэлт) хийсэн тоглогчид; хүрээ: Fisher-ийн арга; 2026–27 улирал дуусаагүй</text>
