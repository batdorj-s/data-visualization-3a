  <g id="text_19">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 13.965749)">Тоглогчийн хэв маяг улирлаас улиралд хадгалагддаг (0.65–0.88),</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 27.037077)">оновч хадгалагддаггүй (0.05)</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 52.30966)">Цэг = нэг тоглогчийн өмнөх ба энэ улирлын үзүүлэлт хэр төстэй вэ, шугам = 95%</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 62.696388)">магадлалтай хүрээ. Цэнхэр = хэв маяг, тоглох хэмжээ; улаан-улбар = оновч. Хүрээ 0-ийг</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 73.083117)">дайрвал холбоо батлагдаагүй</text>
  </g>
