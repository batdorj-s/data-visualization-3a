  <g id="text_27">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 14.008874)">2026–27-д төвийн байрлалын минутын 66%-ийг гадаад тоглогч тоглосон</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 27.080202)">(нийт минутын 38%)</text>
  </g>
  <g id="text_28">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 52.30966)">Багана = тухайн байрлалд тоглосон нийт минутын хэдэн хувийг гадаад тоглогч эзэлсэн;</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 62.696388)">тасархай шугам = бүх байрлалын дундаж. Шугамаас дээш байвал багууд тэр байрлалд гадаад</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 73.036174)">тоглогчид түлхүү найддаг</text>
  </g>
  <g id="text_29">
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 243.965771)">Дата: MBA лигийн албан ёсны статистик (mongolia.basketball), 2026-11-12-нд татсан · байрлал нь MBA-ийн</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 252.71249)">тоглогчийн профайлаас · 10 байрлал-улирал. Төвийн байрлалын илүүдэл (95% хүрээ, тоглогчоор дахин түүвэрлэсэн)</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 261.419678)">— 2025–26: +13% (-5%…+33%), 2026–27: +28% (+8%…+46%)</text>
  </g>
