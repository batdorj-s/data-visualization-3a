  <g id="text_26">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 13.965749)">Булангийн 3 онооны 97% нь дамжуулалтаас гардаг; гадаад тоглогч</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 27.080202)">оноогоо илүү бие даан бүтээдэг (46% vs 59%)</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 52.30966)">Цэг = тухайн бүсээс оносон шидэлтийн дамжуулалттай хувь, шугам = 95% магадлалтай хүрээ.</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 62.696388)">Баруун тийш = хамтын тоглолтоос гарсан оноо, зүүн тийш = тоглогч өөрөө бүтээсэн</text>
  </g>
  <g id="text_28">
