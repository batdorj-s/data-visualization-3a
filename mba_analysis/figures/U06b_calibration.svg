  <g id="text_15">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 14.922606)">Загварын хэлсэн магадлал бодит ялалтын хувьтай таарч</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 28.037059)">байна</text>
  </g>
  <g id="text_16">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 61.751557)">Тоглолтуудыг загварын таамагласан магадлалаар 5 бүлэгт хуваав. Цэг</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 72.138285)">тасархай шугам дээр байвал «70% ялна» гэсэн тоглолтуудын бараг 70% нь</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 82.47807)">үнэхээр ялсан гэсэн үг</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 351.630128)">Дата: MBA лигийн албан ёсны статистик (mongolia.basketball), 2025–26 ба 2026–27 улирал ·</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 360.376847)">183 таамагласан тоглолт. Босоо шугам = бүлэг бүрийн 95% магадлалтай хүрээ</text>
  </g>
 </g>
