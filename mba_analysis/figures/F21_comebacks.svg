   <g id="text_12">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial'; fill: #d55e00" transform="translate(218.881929 127.738632)">10+ оноогоор хоцорч</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial'; fill: #d55e00" transform="translate(218.881929 137.02787)">байгаад ялсан:</text>
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'Arial'; fill: #d55e00" transform="translate(218.881929 146.279091)">53 тоглолт (21%)</text>
