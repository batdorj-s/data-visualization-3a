  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 14.008874)">Ялсан багийн 21% нь 10 ба түүнээс олон оноогоор хоцорч байгаад</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'Arial'; fill: #1a1a1a" transform="translate(4.535433 27.069421)">эргүүлсэн</text>
  </g>
  <g id="text_14">
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 52.262717)">Багана = тийм хэмжээний хоцрогдлыг давж ялсан тоглолтын тоо; 0 = хэзээ ч хоцроогүй.</text>
   <text style="font-size: 9.5px; font-family: 'Arial'; fill: #404040" transform="translate(4.535433 62.64926)">Хамгийн том эргэлт 23 оноо. Ялсан багийн 27% нь хагаст хоцорч байсан</text>
  </g>
  <g id="text_15">
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 252.712646)">Дата: MBA тоглолтын явцын бичлэг · 2025–26 ба 2026–27 улирал · 252 тоглолт. 10+ онооны эргэлтийн хувийн 95%</text>
   <text style="font-size: 8px; font-family: 'Arial'; fill: #5c5c5c" transform="translate(4.535433 261.419834)">магадлалтай хүрээ 16%–26%</text>
  </g>
